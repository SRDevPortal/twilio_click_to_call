[project]
name = "twilio_click_to_call"
version = "0.1.0"
description = "Standalone Twilio Programmable Voice click-to-call integration for Frappe/ERPNext"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "SRIAAS", email = "webdevelopersriaas@gmail.com" }
]
dependencies = [
    "requests",
    "twilio==8.5.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["twilio_click_to_call*"]

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"
